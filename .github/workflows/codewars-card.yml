name: Update Codewars Card

on:
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Generate Codewars card
        run: |
          python <<'PY'
          import html
          import json
          import os
          import urllib.request

          USERNAME = "albertdirksenDev"

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "GitHub-Actions-Codewars-Card"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.load(response)

          profile = get_json(
              f"https://www.codewars.com/api/v1/users/{USERNAME}"
          )

          completed = get_json(
              f"https://www.codewars.com/api/v1/users/"
              f"{USERNAME}/code-challenges/completed?page=0"
          )

          rank = (
              profile
              .get("ranks", {})
              .get("overall", {})
              .get("name", "—")
          )

          honor = profile.get("honor", "—")

          leaderboard = profile.get("leaderboardPosition")

          if leaderboard:
              leaderboard = f"#{leaderboard}"
          else:
              leaderboard = "—"

          completed_count = completed.get(
              "totalItems",
              "—"
          )

          clan = profile.get("clan") or "No clan"

          username = html.escape(
              str(
                  profile.get(
                      "username",
                      USERNAME
                  )
              )
          )

          rank = html.escape(str(rank))
          honor = html.escape(str(honor))
          leaderboard = html.escape(str(leaderboard))
          completed_count = html.escape(
              str(completed_count)
          )
          clan = html.escape(str(clan))

          svg = f"""
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="900"
            height="260"
            viewBox="0 0 900 260"
          >
            <defs>
              <linearGradient
                id="bg"
                x1="0"
                y1="0"
                x2="1"
                y2="1"
              >
                <stop
                  offset="0%"
                  stop-color="#0b0f14"
                />
                <stop
                  offset="50%"
                  stop-color="#121821"
                />
                <stop
                  offset="100%"
                  stop-color="#1a1112"
                />
              </linearGradient>

              <linearGradient
                id="accent"
                x1="0"
                y1="0"
                x2="1"
                y2="0"
              >
                <stop
                  offset="0%"
                  stop-color="#ff5a47"
                />
                <stop
                  offset="100%"
                  stop-color="#ff2d55"
                />
              </linearGradient>

              <filter
                id="softGlow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%"
              >
                <feGaussianBlur
                  stdDeviation="6"
                  result="blur"
                />

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <filter
                id="cardShadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%"
              >
                <feDropShadow
                  dx="0"
                  dy="6"
                  stdDeviation="10"
                  flood-color="#000000"
                  flood-opacity="0.35"
                />
              </filter>
            </defs>

            <rect
              x="0"
              y="0"
              width="900"
              height="260"
              rx="24"
              fill="url(#bg)"
            />

            <rect
              x="1.5"
              y="1.5"
              width="897"
              height="257"
              rx="22.5"
              fill="none"
              stroke="#2f3844"
              stroke-width="1.5"
            />

            <rect
              x="28"
              y="24"
              width="844"
              height="4"
              rx="2"
              fill="url(#accent)"
              filter="url(#softGlow)"
            />

            <circle
              cx="84"
              cy="78"
              r="36"
              fill="#191f28"
              stroke="#ff4d42"
              stroke-width="2.5"
              filter="url(#softGlow)"
            />

            <text
              x="84"
              y="88"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="28"
              font-weight="700"
              fill="#ffffff"
            >
              CW
            </text>

            <text
              x="138"
              y="66"
              font-family="Arial, Helvetica, sans-serif"
              font-size="32"
              font-weight="700"
              fill="#f3f6fb"
            >
              Codewars
            </text>

            <text
              x="138"
              y="95"
              font-family="Arial, Helvetica, sans-serif"
              font-size="20"
              fill="#9aa6b2"
            >
              @{username}
            </text>

            <text
              x="138"
              y="121"
              font-family="Arial, Helvetica, sans-serif"
              font-size="13"
              letter-spacing="1.5"
              fill="#6f7b88"
            >
              AUTO-UPDATING PROFILE CARD
            </text>

            <rect
              x="680"
              y="42"
              width="160"
              height="72"
              rx="16"
              fill="#131922"
              stroke="#ff4d42"
              stroke-width="2.5"
              filter="url(#cardShadow)"
            />

            <text
              x="760"
              y="68"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="13"
              font-weight="700"
              letter-spacing="1.2"
              fill="#8f99a6"
            >
              CURRENT RANK
            </text>

            <text
              x="760"
              y="98"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="30"
              font-weight="700"
              fill="#ff5a47"
            >
              {rank}
            </text>

            <line
              x1="36"
              y1="145"
              x2="864"
              y2="145"
              stroke="#2d3743"
              stroke-width="1"
            />

            <rect
              x="42"
              y="164"
              width="185"
              height="72"
              rx="16"
              fill="#121820"
              stroke="#29313d"
              stroke-width="1.2"
            />

            <rect
              x="246"
              y="164"
              width="185"
              height="72"
              rx="16"
              fill="#121820"
              stroke="#29313d"
              stroke-width="1.2"
            />

            <rect
              x="450"
              y="164"
              width="185"
              height="72"
              rx="16"
              fill="#121820"
              stroke="#29313d"
              stroke-width="1.2"
            />

            <rect
              x="654"
              y="164"
              width="204"
              height="72"
              rx="16"
              fill="#121820"
              stroke="#29313d"
              stroke-width="1.2"
            />

            <text
              x="60"
              y="188"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
              font-weight="700"
              letter-spacing="1.1"
              fill="#8792a0"
            >
              COMPLETED KATA
            </text>

            <text
              x="60"
              y="220"
              font-family="Arial, Helvetica, sans-serif"
              font-size="28"
              font-weight="700"
              fill="#f5f7fb"
            >
              {completed_count}
            </text>

            <text
              x="264"
              y="188"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
              font-weight="700"
              letter-spacing="1.1"
              fill="#8792a0"
            >
              HONOR
            </text>

            <text
              x="264"
              y="220"
              font-family="Arial, Helvetica, sans-serif"
              font-size="28"
              font-weight="700"
              fill="#f5f7fb"
            >
              {honor}
            </text>

            <text
              x="468"
              y="188"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
              font-weight="700"
              letter-spacing="1.1"
              fill="#8792a0"
            >
              LEADERBOARD
            </text>

            <text
              x="468"
              y="220"
              font-family="Arial, Helvetica, sans-serif"
              font-size="28"
              font-weight="700"
              fill="#f5f7fb"
            >
              {leaderboard}
            </text>

            <text
              x="672"
              y="188"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
              font-weight="700"
              letter-spacing="1.1"
              fill="#8792a0"
            >
              CLAN
            </text>

            <text
              x="672"
              y="220"
              font-family="Arial, Helvetica, sans-serif"
              font-size="22"
              font-weight="700"
              fill="#f5f7fb"
            >
              {clan}
            </text>
          </svg>
          """

          os.makedirs(
              "assets",
              exist_ok=True
          )

          with open(
              "assets/codewars-card.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("Codewars card generated")
          print("Username:", username)
          print("Rank:", rank)
          print("Completed:", completed_count)
          print("Honor:", honor)
          print("Leaderboard:", leaderboard)
          print("Clan:", clan)

          PY

      - name: Commit card if changed
        run: |
          git config user.name "AlbertDirksen15"
          git config user.email "50892399+AlbertDirksen15@users.noreply.github.com"

          git add assets/codewars-card.svg

          if git diff --cached --quiet; then
            echo "Card has not changed"
            exit 0
          fi

          git commit -m "Update Codewars profile card"
          git push origin main
