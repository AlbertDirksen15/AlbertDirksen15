
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="260"
  viewBox="0 0 900 260"
>
  <defs>
    <linearGradient
      id="bg"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#0b0f14"
      />
      <stop
        offset="50%"
        stop-color="#121821"
      />
      <stop
        offset="100%"
        stop-color="#1a1112"
      />
    </linearGradient>

    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#ff5a47"
      />
      <stop
        offset="100%"
        stop-color="#ff2d55"
      />
    </linearGradient>

    <filter
      id="softGlow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feGaussianBlur
        stdDeviation="6"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter
      id="cardShadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity="0.35"
      />
    </filter>
  </defs>

  <rect
    x="0"
    y="0"
    width="900"
    height="260"
    rx="24"
    fill="url(#bg)"
  />

  <rect
    x="1.5"
    y="1.5"
    width="897"
    height="257"
    rx="22.5"
    fill="none"
    stroke="#2f3844"
    stroke-width="1.5"
  />

  <rect
    x="28"
    y="24"
    width="844"
    height="4"
    rx="2"
    fill="url(#accent)"
    filter="url(#softGlow)"
  />

  <circle
    cx="84"
    cy="78"
    r="36"
    fill="#191f28"
    stroke="#ff4d42"
    stroke-width="2.5"
    filter="url(#softGlow)"
  />

  <text
    x="84"
    y="88"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="700"
    fill="#ffffff"
  >
    CW
  </text>

  <text
    x="138"
    y="66"
    font-family="Arial, Helvetica, sans-serif"
    font-size="32"
    font-weight="700"
    fill="#f3f6fb"
  >
    Codewars
  </text>

  <text
    x="138"
    y="95"
    font-family="Arial, Helvetica, sans-serif"
